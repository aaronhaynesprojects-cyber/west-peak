name: Deploy West Peak

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from newest West Peak zip
        run: |
          rm -rf _site
          mkdir _site
          ZIP_FILE=$(ls -1t West\ Peak*.zip | head -n 1)
          echo "Deploying: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _site

          # If the zip contains a single top-level folder, flatten it.
          if [ ! -f _site/index.html ]; then
            TOP_DIR=$(find _site -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$TOP_DIR" ] && [ -f "$TOP_DIR/index.html" ]; then
              shopt -s dotglob
              mv "$TOP_DIR"/* _site/
              rmdir "$TOP_DIR"
            fi
          fi

          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/terrain.js
          test -d _site/audio

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
